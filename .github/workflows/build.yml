name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromebook:
    name: Chromebook (extension + single HTML page)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chromebook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chromebook/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (PAKE, TCP tunnel, cache, framing, cross-language vectors)
        run: npm test
      - name: Independent vector check (Python)
        run: |
          python -m pip install --quiet cryptography
          python ../protocol/xcheck.py
      - name: Package extension and build PhoneBridge.html
        run: npm run build
      - name: Install Chrome for Testing (falls back to the runner's Chrome)
        run: |
          CFT=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" 2>/dev/null | tail -1 | cut -d' ' -f2-) || true
          if [ -n "$CFT" ] && [ -x "$CFT" ]; then echo "CHROME_PATH=$CFT" >> "$GITHUB_ENV"; else echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; fi
      - name: End-to-end (extension in headless Chrome, Chrome's own network blackholed, mock iPhone)
        run: npm run test:e2e
        env:
          PB_REAL_NET: "1"   # also loads https://registry.npmjs.org over real TLS on the "Chromebook"; ciphertext only through the "iPhone"
      - name: End-to-end (PhoneBridge.html opened from file://, same mock iPhone)
        run: node tests/e2e/page.mjs
        env:
          PB_REAL_NET: "1"
      - name: End-to-end (PhoneBridge.html over a fake Web Serial port to the real PhoneBridge Pi relay)
        run: node tests/e2e/pi.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-extension
          path: chromebook/dist/PhoneBridge-extension.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-html
          path: |
            chromebook/dist/PhoneBridge.html
            chromebook/dist/PhoneBridge-Pi.html
          if-no-files-found: error
      - name: Stage hosted copy (GitHub Pages)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: chromebook/dist/pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: chromebook/dist/e2e-shots
          if-no-files-found: ignore

  pages:
    # Publishes the same page at https://<user>.github.io/<repo>/ — an https copy that works offline after
    # one visit, for Chromebooks where Chrome won't give Bluetooth to a file. Needs a one-time switch:
    # repo Settings → Pages → Source: GitHub Actions. Until then this job fails without affecting the build.
    name: Hosted page (GitHub Pages)
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: chromebook
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  pi:
    name: PhoneBridge Pi (relay tests + Raspberry Pi OS image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relay on a real tty (pty), real TCP
        run: python3 pi/tests/test_tty.py
      - name: Chrome for Testing (unbranded like Raspberry Pi OS's Chromium; branded Chrome ignores --load-extension)
        run: |
          CFT=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" 2>/dev/null | tail -1 | cut -d' ' -f2-)
          test -x "$CFT"
          echo "CHROMIUM=$CFT" >> "$GITHUB_ENV"
      - name: Pi browser mode (relay drives a real Chromium over DevTools)
        run: python3 pi/tests/test_render.py
      - name: Installer against a stock config.txt (fake image root)
        run: sudo sh pi/tests/test_install.sh
      - name: Shell checks
        run: |
          sh -n pi/gadget.sh && sh -n pi/wifi.sh && sh -n pi/install.sh
          shellcheck -s sh -S warning pi/gadget.sh pi/wifi.sh pi/install.sh pi/tests/test_install.sh
      - name: ARM64 emulation for the image's chroot (installs Chromium inside it)
        # docker/setup-qemu-action registers static qemu with the F (fix-binary) flag, so a plain
        # chroot into the arm64 image works; Ubuntu 26.04 no longer ships a qemu-user-static package.
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build the SD card image (Raspberry Pi OS Lite 64-bit + PhoneBridge Pi)
        # Only where it's kept: ~450 MB download, ~2.5 GB image.
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          URL=$(curl -sSIL -o /dev/null -w '%{url_effective}' https://downloads.raspberrypi.com/raspios_lite_arm64_latest)
          echo "base image: $URL"
          curl -sSL -o base.img.xz "$URL"
          curl -sSL -o base.img.xz.sha256 "$URL.sha256" && (echo "$(cut -d' ' -f1 base.img.xz.sha256)  base.img.xz" | sha256sum -c -)
          xz -d -T0 base.img.xz
          mv base.img PhoneBridge-Pi.img
          # Room for Chromium (~400 MB with its libraries); the card's free space is added on first boot anyway.
          truncate -s +1600M PhoneBridge-Pi.img
          sudo apt-get update -q && sudo apt-get install -y -q cloud-guest-utils
          grep -q enabled /proc/sys/fs/binfmt_misc/qemu-aarch64 || { echo "arm64 emulation isn't registered" >&2; exit 1; }
          LOOP=$(sudo losetup -Pf --show PhoneBridge-Pi.img)
          sudo growpart "$LOOP" 2
          sudo partx -u "$LOOP" || sudo losetup -c "$LOOP"
          sudo e2fsck -pf "${LOOP}p2" || true
          sudo resize2fs "${LOOP}p2"
          sudo mkdir -p /mnt/pi
          sudo mount "${LOOP}p2" /mnt/pi
          sudo mount "${LOOP}p1" /mnt/pi/boot/firmware
          sudo chroot /mnt/pi /bin/true && echo "chroot into the arm64 image works"
          sudo sh pi/install.sh --root /mnt/pi --chromium
          test -x /mnt/pi/usr/bin/chromium || test -x /mnt/pi/usr/bin/chromium-browser
          test -f /mnt/pi/usr/local/lib/phonebridge/pbrender.py
          test -x /mnt/pi/usr/local/lib/phonebridge/phonebridge-pi.py
          test -L /mnt/pi/etc/systemd/system/multi-user.target.wants/phonebridge.service
          tail -n 3 /mnt/pi/boot/firmware/config.txt | grep -qx 'dtoverlay=dwc2,dr_mode=peripheral'
          test -f /mnt/pi/boot/firmware/connect.txt
          test -x /mnt/pi/usr/bin/python3 && test -x /mnt/pi/usr/bin/nmcli
          echo "$URL" | sudo tee /mnt/pi/usr/local/lib/phonebridge/BASE_IMAGE
          sudo umount /mnt/pi/boot/firmware /mnt/pi
          sudo losetup -d "$LOOP"
          xz -T0 -6 PhoneBridge-Pi.img
          ls -lh PhoneBridge-Pi.img.xz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: PhoneBridge-Pi-image
          path: PhoneBridge-Pi.img.xz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Pi-files
          path: pi/
          if-no-files-found: error

  core:
    name: Swift core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: PhoneBridgeCore tests (field math, PAKE handshake, vectors, tunnel frames)
        run: swift test --package-path ios/PhoneBridgeCore

  ios:
    name: iOS app (unsigned IPA)
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project ios/PhoneBridge.xcodeproj \
            -scheme PhoneBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PhoneBridge.app
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../PhoneBridge-unsigned.ipa Payload)
          ls -lh PhoneBridge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-ios
          path: PhoneBridge-unsigned.ipa
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chromebook, ios, pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PhoneBridge-ios/PhoneBridge-unsigned.ipa
            artifacts/PhoneBridge-extension/PhoneBridge-extension.zip
            artifacts/PhoneBridge-html/PhoneBridge.html
            artifacts/PhoneBridge-html/PhoneBridge-Pi.html
            artifacts/PhoneBridge-Pi-image/PhoneBridge-Pi.img.xz
          generate_release_notes: true
