name: PhoneBridge
options:
  bundleIdPrefix: app.phonebridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  PhoneBridgeCore:
    path: PhoneBridgeCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PhoneBridge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Bluetooth
      - path: Tunnel
      - path: Security
      - path: Settings
    dependencies:
      - package: PhoneBridgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.phonebridge.host
        PRODUCT_NAME: PhoneBridge
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

schemes:
  PhoneBridge:
    build:
      targets:
        PhoneBridge: all
    run:
      config: Debug
    archive:
      config: Release
